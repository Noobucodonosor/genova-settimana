[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genova-outings"
version = "0.1.0"
description = "Agenda civica e culturale verificata per Genova e i 67 comuni della Città Metropolitana."
readme = "site/README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genova-outings = "genova_outings.cli:main"

[tool.setuptools.packages.find]
include = ["genova_outings*"]
